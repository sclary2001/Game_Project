<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stick Jump Runner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #111;
      --text: #fff;
      --accent: #00ffcc;
      --danger: #ff4d4d;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Press Start 2P', cursive;
    }

    header, main, footer {
      padding: 10px;
    }

    #gameArea {
      position: relative;
      height: 200px;
      background: #222;
      border: 2px solid var(--accent);
      overflow: hidden;
      margin: 20px auto;
    }

    #player {
      position: absolute;
      bottom: 0;
      left: 50px;
      width: 20px;
      height: 40px;
      background: white;
    }

    #obstacle {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 20px;
      height: 30px;
      background: var(--danger);
    }

    .jump {
      animation: jump 0.5s;
    }

    @keyframes jump {
      0% { bottom: 0; }
      50% { bottom: 100px; }
      100% { bottom: 0; }
    }

    a {
      color: var(--accent);
    }

    a:focus {
      outline: 2px solid var(--accent);
    }

    img {
      max-width: 100%;
      border: 2px solid var(--accent);
    }
  </style>
</head>

<body>

<header>
  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
      <span class="navbar-brand">🏃 Stick Jump Runner</span>

      <div>
        <button id="startBtn" class="btn btn-success">Play</button>
        <button id="resetBtn" class="btn btn-danger">Reset</button>
      </div>
    </div>
  </nav>
</header>

<main class="container text-center">

  <!-- ONLY ONE H1 -->
  <h1>Stick Jump Runner</h1>

  <p>Press SPACE or click to jump over obstacles.</p>

  <!-- GAME REGION -->
  <section id="gameArea" tabindex="0" aria-live="polite" aria-label="Game area">
    <div id="player" aria-label="Player"></div>
    <div id="obstacle" aria-label="Obstacle"></div>
  </section>

  <!-- SCORE (REQUIRED STATE DISPLAY) -->
  <section aria-label="Score section">
    <p>Score: <span id="score">0</span></p>
    <p>Best: <span id="best">0</span></p>
  </section>

  <!-- SETTINGS FORM (VALIDATION REQUIRED) -->
  <section>
    <form id="settingsForm">

      <label for="playerName">Player Name</label>
      <input id="playerName" class="form-control" required minlength="2">

      <label for="difficulty" class="mt-2">Difficulty</label>
      <select id="difficulty" class="form-select" required>
        <option value="">Choose difficulty</option>
        <option value="easy">Easy</option>
        <option value="hard">Hard</option>
      </select>

      <button class="btn btn-primary mt-3">Save Settings</button>
    </form>
  </section>

  <!-- IMAGE WITH ALT TEXT FIX -->
  <section class="mt-4">
    <img src="images/screenshot.png"
         alt="Stickman jumping over obstacle in side scrolling game">
  </section>

</main>

<!-- FOOTER (FULLY FIXED LINKS) -->
<footer class="text-center mt-5 mb-4">

  <p>
    <a href="https://github.com/sclary2001" target="_blank" rel="noopener">
      Dev Profile
    </a> |

    <a href="https://github.com/sclary2001/Game_Project" target="_blank" rel="noopener">

    <a href="https://github.com/sclary2001" target="_blank" rel="noopener">

    </a> |

    <a href="https://validator.w3.org/nu/?doc=https://sclary2001.github.io/Game_Project/" target="_blank" rel="noopener">
      Nu Validator
    </a> |

    <a href="https://wave.webaim.org/report#/https://sclary2001.github.io/Game_Project/" target="_blank" rel="noopener">
      WAVE Checker
    </a>
  </p>

</footer>

<!-- JS -->
<script type="module" src="scripts/main.js"></script>

</body>
</html>
